  - type: APIReference
    url: https://deskera.github.io/Developer-Documentation/docs/sales/contactsapi
- aid: deskera:crmplus
  name: Deskera CRM+ API
  description: 'REST API for Deskera CRM+ — a table/column/record data model that lets
    an application create tables, define columns and manage records inside the CRM+
    workspace. Documented on the public Deskera developer documentation site.'
  humanURL: https://deskera.github.io/Developer-Documentation/docs/crmplus/started
  baseURL: https://bifrost-us.deskera.com
  tags:
