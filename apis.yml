apis:
- aid: deskera:books
  name: Deskera Books API
  description: 'REST API for Deskera Books, the cloud ERP and accounting product —
    contacts, products, accounts, invoices, bills, quotations, sales and purchase orders,
    credit and debit notes, deposits, expenses, payments, fulfillment, shipments, stock
    and warehouses, MRP, taxes, journals, tenants, custom fields, reports and webhooks.
    Documented on the public Deskera developer documentation site; secured with an
    x-access-token header issued through the Deskera OAuth 2.0 flow.'
  humanURL: https://deskera.github.io/Developer-Documentation/docs/books/started
  baseURL: https://bifrost-us.deskera.com
  tags:
