  - type: APIReference
    url: https://deskera.github.io/Developer-Documentation/docs/crmplus/record-api
- aid: deskera:people
  name: Deskera People API
  description: 'API for Deskera People, the HR, payroll and employee-self-service product
    — employees, teams, shifts, attendance, leave, expenses, bank accounts, pay schedules,
    pay runs, payroll components and component groups, compliance, templates, tenants
    and users. Documented on the public Deskera developer documentation site, largely
    through the Deskera Java SDK client surface.'
