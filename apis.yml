  - type: Webhooks
    url: https://deskera.github.io/Developer-Documentation/docs/books/webhook
- aid: deskera:sales
  name: Deskera Sales API
  description: 'REST API for Deskera Sales — contacts, deals, activities and campaigns
    for the CRM side of the platform. Documented on the public Deskera developer documentation
    site under the same x-access-token authentication model as Books.'
  humanURL: https://deskera.github.io/Developer-Documentation/docs/sales/started
  baseURL: https://bifrost-us.deskera.com
  tags:
