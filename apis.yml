aid: deskera
name: Deskera
description: 'Deskera is a cloud business-software suite for small and mid-sized businesses,
  combining ERP and accounting (Deskera Books), CRM and sales (Deskera Sales / CRM+),
  and HR and payroll (Deskera People) on a single platform covering purchasing, sales,
  stock and inventory, warehouses, manufacturing/MRP, billing, invoicing, quotations,
  payments, tax and financial reporting, contacts and deals, employees, attendance,
  leave, expenses and pay runs. Deskera publishes a public developer documentation
  site covering REST APIs for Books, Sales, CRM+ and People, a three-legged OAuth 2.0
  authorization flow with an x-access-token bearer header, a webhook registration API
  with a documented event catalog, separate staging and production environments, and
  a Java SDK. The company operates from Singapore and the United States and also trades
  under the erp.ai brand for account sign-up and sign-in.'
