errors:
  envelope: >-
    Error responses are documented as a Code/Description/Schema table per operation;
    successful envelopes commonly carry {"success": true, "id": ...}. The API host
    itself returns a JSON envelope of the shape
    {"status","code","message","requestPath"} on gateway-level errors.
  problem_json: false
  rfc9457: false
  artifact: errors/deskera-problem-types.yml
