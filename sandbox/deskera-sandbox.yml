note: >-
  Deskera runs a fully separate staging estate on the deskera.xyz domain and
  publishes its base URLs in the developer documentation. There is no self-service
  sandbox sign-up, no test-mode key prefix, no seeded test data and no fixture or
  simulation tooling — access is obtained by registering as a partner by email.
  No test values are published, so none are recorded here.
environments:
